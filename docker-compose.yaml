services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:16.2-alpine
    container_name: udecprac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - udecprac-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Backend Spring Boot (Gradle)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: udecprac-backend:1.0.0
    container_name: udecprac-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - udecprac-network

  # 3. Frontend Angular (Nginx)
  frontend:
    build:
      context: ../../frontendUdecPrac/frontend-udecprac
      dockerfile: Dockerfile
    image: udecprac-frontend:1.0.0
    container_name: udecprac-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - udecprac-network

volumes:
  postgres_data:

networks:
  udecprac-network:
    driver: bridge