name: Backend CI - UdecPrac (Spring Boot + JUnit 5)

on:
  push:
    branches: [ main, develop, pre-produccion, "feat/**", "feature/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código fuente (Checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Dar permisos de ejecución a Gradle Wrapper
        run: chmod +x gradlew

      - name: 4. Compilar Arquitectura Hexagonal y Ejecutar Pruebas Unitarias (JUnit 5 + JaCoCo)
        run: ./gradlew clean test jacocoTestReport --no-daemon