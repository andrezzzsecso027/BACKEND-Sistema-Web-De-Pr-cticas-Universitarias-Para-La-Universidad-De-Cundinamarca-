spring.application.name=backend-udecprac
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.config.import=optional:file:.env[.properties]
jwt.secret=${JWT_SECRET}
brevo.api.key=${brevo.api.key}
brevo.sender.email=${brevo.sender.email}
brevo.sender.name=${brevo.sender.email}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
logging.file.name=logs/udecprac-backend.log
logging.level.root=INFO
logging.level.co.edu.ucundinamarca.backendudecprac=INFO
gemini.api.key=${GEMINI_API_KEY:}
# Subida de archivos (RUT/NIT, contratos, hojas de vida). Por defecto Spring solo acepta 1 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
